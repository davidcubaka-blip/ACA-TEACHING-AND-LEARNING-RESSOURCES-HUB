<div class="container"><div class="card"><h2>Week 6 · Adjectives and agreement</h2>
<p>Examples: grand / grande / grands / grandes; petit / petite / petits / petites; gentil / gentille / gentils / gentilles; beau / belle / beaux / belles.</p>
<p>Possessive adjectives: mon, ma, mes — use mon before vowel sound (mon amie).</p>
